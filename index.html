<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeMind — Providing Hope, Healing, and Strength for a Sound Mind.">
    <meta name="theme-color" content="#0a0f14">
    <title>SafeMind</title>
    <link rel="stylesheet" href="stylesheet.css?v=4"> </head>

<body>
    <header>
        <img src="images/logo.png" alt="SafeMind Logo" class="logo">
        
        <button class_regular="hamburger-menu mobile-only" id="mobile-hamburger-main" aria-label="Toggle navigation" aria-expanded="false">
            <ion-icon name="menu"></ion-icon>
        </button>

        <nav class="navigation" id="primary-navigation" aria-label="Primary">
            <a href="index.html" id="nav-home-link">Home</a>
            <a href="about.html">About</a>
            <a href="#" class="btnLogin-popup" id="nav-action-link">Login</a>
        </nav>
    </header>

    <div class="left-container">
        <main class="content">
            <h1>SAFEMIND</h1>
            <p class="description">
                "Providing Hope, Healing, and Strength for a Sound Mind."
            </p>
        </main>
    </div>

    <div class="wrapper">
        <span class="icon-close">
            <ion-icon name="close"></ion-icon>
        </span>

        <div class="form-box login">
            <h2>Login</h2>
            <form action="#" autocomplete="on">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" id="login-email" name="email" autocomplete="email" required placeholder=" ">
                    <label for="login-email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder=" ">
                    <label for="login-password">Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" name="remember">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Administrator access only.</p>
                </div>
            </form>
        </div>

        </div>

    <script type="module" src="script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeMind — Providing Hope, Healing, and Strength for a Sound Mind.">
    <meta name="theme-color" content="#0a0f14">
    <title>SafeMind</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="SafeMind Logo" class="logo">
        <nav class="navigation" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    <button class="btnLogin-popup">Login</button>
</nav>
    </header>

    <div class="left-container">
        <main class="content">
            <h1>SAFEMIND</h1>
            <p class="description">
                "Providing Hope, Healing, and Strength for a Sound Mind."
            </p>
        </main>
    </div>
    
    <div class="wrapper">
        <span class="icon-close">
            <ion-icon name="close"></ion-icon>
        </span>

        <div class="form-box login">
            <h2>Login</h2>
            <form action="#" autocomplete="on">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" id="login-email" name="email" autocomplete="email" required>
                    <label for="login-email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                    <label for="login-password">Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" name="remember">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Don't have an account?<a href="#" class="register-link">Register</a></p>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <h2>Registration</h2>
            <form action="#" autocomplete="on">
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="person"></ion-icon>
                    </span>
                    <input type="text" id="register-username" name="username" autocomplete="username" required>
                    <label for="register-username">Username</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"></ion-icon>
                    </span>
                    <input type="email" id="register-email" name="email" autocomplete="email" required>
                    <label for="register-email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"></ion-icon>
                    </span>
                    <input type="password" id="register-password" name="password" autocomplete="new-password" required>
                    <label for="register-password">Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" name="terms" required>I'm 18+ and agree to the terms</label>
                </div>
                <button type="submit" class="btn">Register</button>
                <div class="login-register">
                    <p>Already have an account?<a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>

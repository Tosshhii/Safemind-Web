<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeMind - User Profiles (Without Consultations)</title>
    <link rel="stylesheet" href="stylesheet.css?v=5">
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <button class="hamburger-menu mobile-only" id="mobile-hamburger">
            <ion-icon name="menu"></ion-icon>
        </button>
        <div class="header-left">
            <img src="images/logo.png" alt="SafeMind Logo" class="dashboard-logo">
        </div>
        <div class="header-right">
            <div class="user-avatar">
                <ion-icon name="person-circle"></ion-icon>
            </div>
            <div class="profile-dropdown">
                <div class="profile-info">
                    <ion-icon name="person-circle-outline"></ion-icon>
                    <span id="user-email-display">loading...</span>
                </div>
                <ul class="profile-menu">
                    <li><a href="#" id="logout-button"><ion-icon name="log-out-outline"></ion-icon>Logout</a></li>
                </ul>
            </div>
        </div>
    </header>

    <nav class="dashboard-sidebar">
        <div class="sidebar-header">
            <button class="hamburger-menu">
                <ion-icon name="menu"></ion-icon>
            </button>
        </div>
        <ul class="sidebar-nav">
            <li class="nav-item hidden"><a href="index.html">Home</a></li>
            <li class="nav-item hidden"><a href="about.html">About Us</a></li>
            
            <li>
                <button class="sidebar-category">Consultations</button>
                <ul class="dropdown-menu hidden">
                    <li><a href="pending-requests.html" class="sub-link">Pending Requests</a></li>
                    <li><a href="confirmed-consultations.html" class="sub-link">Confirmed Consultations</a></li>
                </ul>
            </li>

            <li>
                <button class="sidebar-category">Patient Profiles</button>
                <ul class="dropdown-menu hidden">
                    <li><a href="user-profiles-today.html" class="sub-link">Scheduled Today</a></li>
                    <li><a href="user-profiles-finished.html" class="sub-link">Finished Consultations</a></li>
                    <li><a href="user-profiles-future.html" class="sub-link">Future Consultations</a></li>
                </ul>
            </li>

            <li>
                <button class="sidebar-category">User Profiles</button>
                <ul class="dropdown-menu hidden">
                    <li><a href="user-profiles-unscheduled.html" class="sub-link active-sub">Without Consultations</a></li>
                </ul>
            </li>

            <li><a href="calendar.html" class="sidebar-category">Calendar</a></li>
        </ul>
    </nav>

    <main class="dashboard-main">
        <div class="dashboard-content">
            <h1 class="dashboard-title">User Profiles — Without Consultations</h1>

            <div class="table-toolbar">
                <label for="user-profiles-sort">Sort by:</label>
                <select id="user-profiles-sort" class="table-sort-select">
                    <option value="name">Name (A–Z)</option>
                    <option value="latest">Latest registered</option>
                </select>
            </div>

            <div id="user-profiles-grid-unscheduled" class="user-profiles-grid">
                <!-- Unscheduled user cards will be injected by script.js -->
            </div>
        </div>
    </main>

    <script type="module" src="script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
